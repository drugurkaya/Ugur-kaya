<script>
"use strict";
/* =====================================================================
   KUŞLARIN İNTİKAMI — iPhone / tarayıcı sürümü
   Masaüstü (Python + Pygame) sürümünün HTML5 Canvas + Web Audio uyarlaması.
   Grafikler ve sesler tamamen kodla üretilir; harici dosya gerekmez.
   ===================================================================== */

// ------------------------------------------------------------- Sabitler
const W = 1280, H = 720, FPS_DT = 1 / 60;
const GROUND_Y = 625, GRAVITY = 900, ROAD_Y = 610, CAR_GROUND = ROAD_Y + 52;
const OUT = "#281e32", WHITE = "#ffffff";
const FONT = "Fredoka, 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif";
const TOUCH = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
const UI_GREEN = "#50c86e", UI_BLUE = "#5096ff", UI_ACCENT = "#ff783c", UI_PINK = "#c85a78";

const BT = {
  blue:   { name: "Mavi Serçe",     points: 10,  size: 17, speed: 190, body: [80,150,255],  belly: "#bee1ff", wing: "#326edc", hop: 0.05, scare: 95, pitch: 2600 },
  yellow: { name: "Sarı Kanarya",   points: 20,  size: 20, speed: 220, body: [255,215,50],  belly: "#fff5b4", wing: "#ebaa1e", hop: 0.08, scare: 90, pitch: 2200 },
  red:    { name: "Hızlı Kızılkuş", points: 30,  size: 18, speed: 330, body: [235,60,60],   belly: "#ffbeaa", wing: "#b9232d", hop: 0.22, scare: 80, pitch: 3000 },
  gold:   { name: "Altın Kuş",      points: 100, size: 16, speed: 380, body: [255,200,30],  belly: "#fff0a0", wing: "#dc9600", hop: 0.35, scare: 70, pitch: 3400 },
};
// Dokunmatik ekranda nişan almak biraz daha zor: korkutma alanı ve önizleme biraz daha cömert.
const TOUCH_SCARE = TOUCH ? 1.12 : 1.0;
const LEVELS = {
  1: { name: "Kuşlarla Tanışma", kind: "throw", stones: 25, goal: 12, speedMult: 0.7, maxBirds: 14, spawnEvery: 2.2,
       weights: { blue: 60, yellow: 30, red: 10, gold: 2 }, flocks: false, revenge: false, preview: 1.0,
       tip: TOUCH ? "Ekrana bas ve tut, parmağınla nişan al, bırak!" : "Fareye basılı tut, nişan al ve bırak!" },
  2: { name: "Kuşların Öfkesi", kind: "throw", stones: 32, goal: 22, speedMult: 1.2, maxBirds: 20, spawnEvery: 1.5,
       weights: { blue: 35, yellow: 35, red: 28, gold: 4 }, flocks: true, revenge: true, preview: 0.5,
       tip: TOUCH ? "Kuşlar sinirlendi! ◀ ▶ ile kaç, dalan kuşları taşla savuştur." : "Kuşlar sinirlendi! A/D ile kaç, dalan kuşları taşla savuştur." },
  3: { name: "Büyük Kaçış", kind: "escape", length: 22000,
       tip: TOUCH ? "GAZ ve FREN ile hızı ayarla, ◀ ▶ ile sür, ZIPLA ile engelleri aş!" : "W hızlan, S yavaşla, A/D ileri-geri, BOŞLUK zıpla!" },
};
const LAST_LEVEL = 3;
const THROW_MIN = 380, THROW_MAX = 1250, CHARGE_TIME = 1.0, COMBO_STEP = 0.5, COMBO_MAX = 6, HIT_BONUS = 15;
const MAX_HEALTH = 100, PLAYER_SPEED = 300;
const CAR_MIN = 160, CAR_CRUISE = 340, CAR_MAXS = 680, CAR_ACCEL = 420, CAR_BRAKE = 600, CAR_JUMP = 640, CAR_GRAV = 1700;
const TREE_COLORS = [["#5ac85a", "#8ce678"], ["#ff82be", "#ffb4dc"], ["#fad23c", "#ffeb82"], ["#a06ee6", "#c8a0fa"]];
const FLOWER_COLORS = ["#ff5a78", "#ffdc46", "#78a0ff", "#ffffff", "#e678ff", "#ff963c"];
const SOUND_CATS = { birds: "Kuş Sesleri", sfx: "Efektler", engine: "Motor", music: "Müzik" };

// ------------------------------------------------------------- Yardımcılar
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const lerpC = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };
function weighted(obj) {
  const keys = Object.keys(obj); let tot = 0; for (const k of keys) tot += obj[k];
  let r = Math.random() * tot; for (const k of keys) { r -= obj[k]; if (r <= 0) return k; } return keys[0];
}
function seeded(seed) {   // Tekrarlanabilir arka planlar için basit rastgele üreteç
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  f.uniform = (x, y) => x + f() * (y - x);
  f.int = (x, y) => Math.floor(f.uniform(x, y + 1));
  f.choice = arr => arr[Math.floor(f() * arr.length)];
  return f;
}
function storeGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* depolama yoksa önemsiz */ } }

// ------------------------------------------------------------- Çizim yardımcıları
function circ(g, x, y, r, fill, stroke, lw = 2) {
  g.beginPath(); g.arc(x, y, Math.max(0.5, r), 0, TAU);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}
function ell(g, x, y, rx, ry, rot, fill, stroke, lw = 2) {
  g.beginPath(); g.ellipse(x, y, Math.max(0.5, rx), Math.max(0.5, ry), rot, 0, TAU);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}
function poly(g, pts, fill, stroke, lw = 2) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineJoin = "round"; g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}
function line(g, x1, y1, x2, y2, color, lw, cap = "round") {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
  g.lineCap = cap; g.lineWidth = lw; g.strokeStyle = color; g.stroke();
}
function rrect(g, x, y, w, h, r, fill, stroke, lw = 2) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
}
function txt(g, s, x, y, size, color, o = {}) {
  g.font = `${o.w || 600} ${size}px ${FONT}`;
  g.textAlign = o.align || "center";
  g.textBaseline = o.base || "middle";
  const ol = o.ol === undefined ? Math.max(2, size / 10) : o.ol;
  if (ol) { g.lineJoin = "round"; g.lineWidth = ol * 2; g.strokeStyle = o.oc || OUT; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
function star(g, x, y, r, rot, fill, stroke) {
  const pts = [];
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  poly(g, pts, fill, stroke, 1.5);
}
// Ekran dışı katmanlar (arka plan) yüksek çözünürlükte bir kez çizilir
let LAYER_K = 1;
function layer(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = Math.ceil(w * LAYER_K); c.height = Math.ceil(h * LAYER_K);
  const g = c.getContext("2d"); g.scale(LAYER_K, LAYER_K); draw(g);
  c.lw = w; c.lh = h; return c;
}
const blitL = (g, c, x, y) => g.drawImage(c, x, y, c.lw, c.lh);

// =====================================================================
//  SES: Web Audio ile sentez (kuşlar, efektler, motor, müzik)
// =====================================================================
const SR = 22050;
const Snd = {
  ctx: null, master: null, cat: {}, on: { birds: true, sfx: true, engine: true, music: true }, muted: false,
  bufs: {}, catOf: {}, gap: {}, last: {}, musicSrc: null, musicName: null, musicLoop: true,
  engSrc: null, engGain: null,

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      for (const k of Object.keys(SOUND_CATS)) { const gn = this.ctx.createGain(); gn.connect(this.master); this.cat[k] = gn; }
      this.cat.music.gain.value = 0.32;
      this.build();
      this.apply();
      // iOS: sessiz bir tampon çalmak sesi açar
      const b = this.ctx.createBuffer(1, 1, SR), s = this.ctx.createBufferSource(); s.buffer = b; s.connect(this.master); s.start(0);
      if (this.pendingMusic) { const [n, l] = this.pendingMusic; this.pendingMusic = null; this.music(n, l); }
    }
    if (this.ctx.state !== "running") this.ctx.resume().catch(() => {});
  },
  buf(arr, vol = 0.8) {
    const b = this.ctx.createBuffer(1, arr.length, SR), d = b.getChannelData(0);
    for (let i = 0; i < arr.length; i++) d[i] = clamp(arr[i] * vol, -1, 1);
    return b;
  },
  add(name, cat, variants, vol = 0.8, gap = 0) {
    this.bufs[name] = variants.map(v => this.buf(v, vol)); this.catOf[name] = cat; this.gap[name] = gap;
  },
  build() {
    const osc = (w, p) => { p -= Math.floor(p); return w === "sine" ? Math.sin(TAU * p) : w === "square" ? (p < 0.5 ? 0.6 : -0.6) : w === "tri" ? 4 * Math.abs(p - 0.5) - 1 : 2 * p - 1; };
    const sweep = (f0, f1, dur, w = "sine", vr = 0, vd = 0, curve = 1) => {
      const n = Math.floor(SR * dur), out = new Float32Array(n); let ph = 0;
      for (let i = 0; i < n; i++) { let f = f0 + (f1 - f0) * Math.pow(i / n, curve); if (vr) f *= 1 + vd * Math.sin(TAU * vr * i / SR); ph += f / SR; out[i] = osc(w, ph); }
      return out;
    };
    const noise = dur => { const n = Math.floor(SR * dur), o = new Float32Array(n); for (let i = 0; i < n; i++) o[i] = Math.random() * 2 - 1; return o; };
    const lp = (s, a) => { let y = 0; const o = new Float32Array(s.length); for (let i = 0; i < s.length; i++) { y += a * (s[i] - y); o[i] = y; } return o; };
    const env = (s, att = 0.01, rel = 0.3) => { const n = s.length, a = Math.max(1, att * SR | 0), r = Math.max(1, rel * n | 0); for (let i = 0; i < n; i++) { let g = 1; if (i < a) g = i / a; if (i > n - r) g *= (n - i) / r; s[i] *= g; } return s; };
    const cat = (...p) => { let n = 0; for (const x of p) n += x.length; const o = new Float32Array(n); let k = 0; for (const x of p) { o.set(x, k); k += x.length; } return o; };
    const mix = (...p) => { const n = Math.max(...p.map(x => x.length)), o = new Float32Array(n); for (const x of p) for (let i = 0; i < x.length; i++) o[i] += x[i]; return o; };
    const sil = d => new Float32Array(Math.floor(SR * d));
    const song = (bpm, tracks, beats, hats) => {
      const spb = 60 / bpm, n = Math.floor(SR * beats * spb), buf = new Float32Array(n);
      for (const [w, vol, notes] of tracks) for (const [st, len, m] of notes) {
        if (m == null) continue;
        const f = 440 * Math.pow(2, (m - 69) / 12), s0 = Math.floor(st * spb * SR), ln = Math.floor(len * spb * SR), att = Math.floor(0.008 * SR), rel = Math.max(1, ln * 0.35 | 0);
        let ph = 0;
        for (let i = 0; i < ln && s0 + i < n; i++) { let g = 1; if (i < att) g = i / att; else if (i > ln - rel) g = (ln - i) / rel; ph += f / SR; buf[s0 + i] += osc(w, ph) * vol * g; }
      }
      if (hats) { const [vol, every] = hats, step = every * spb; for (let k = 0; k * step < beats * spb; k++) { const s0 = Math.floor(k * step * SR), ln = Math.floor(0.03 * SR); for (let i = 0; i < ln && s0 + i < n; i++) buf[s0 + i] += (Math.random() * 2 - 1) * vol * (1 - i / ln); } }
      return buf;
    };
    // Kuşlar
    for (const k of Object.keys(BT)) {
      const p0 = BT[k].pitch, vars = [];
      for (let v = 0; v < 3; v++) { const p = p0 * rand(0.9, 1.1); vars.push(cat(env(sweep(p, p * 1.5, 0.07, "sine", 40, 0.05), 0.005, 0.4), sil(0.03), env(sweep(p * 1.3, p * 0.9, 0.08 + 0.02 * v, "sine", 30, 0.06), 0.005, 0.5))); }
      this.add("chirp_" + k, "birds", vars, 0.35, 0.12);
    }
    const flap = () => { const parts = []; for (let i = 0; i < 3; i++) { parts.push(env(lp(noise(0.05), 0.25), 0.005, 0.8)); parts.push(sil(0.03)); } return cat(...parts); };
    this.add("flap", "birds", [flap(), flap()], 0.5, 0.08);
    this.add("cry", "birds", [lp(cat(env(sweep(720, 520, 0.45, "saw", 7, 0.06), 0.03, 0.4), sil(0.08), env(sweep(680, 430, 0.6, "saw", 7, 0.08), 0.03, 0.5)), 0.35)], 0.45, 0.3);
    const hc = env(sweep(900, 1500, 0.15, "square", 12, 0.05), 0.01, 0.3);
    this.add("help", "birds", [lp(cat(hc, sil(0.05), hc), 0.4)], 0.35, 0.4);
    this.add("angry", "birds", [lp(env(sweep(500, 300, 0.35, "saw", 25, 0.15), 0.01, 0.4), 0.3)], 0.45, 0.25);
    // Efektler
    const whoosh = () => { const n = noise(0.28), o = new Float32Array(n.length); let y = 0; for (let i = 0; i < n.length; i++) { const a = 0.05 + 0.4 * Math.sin(Math.PI * i / n.length); y += a * (n[i] - y); o[i] = y * 1.6; } return env(o, 0.02, 0.4); };
    this.add("throw", "sfx", [whoosh()], 0.7, 0.05);
    this.add("hit", "sfx", [mix(env(sweep(420, 110, 0.22, "sine", 0, 0, 0.5), 0.002, 0.7), env(lp(noise(0.03), 0.5), 0.001, 0.9))], 0.9, 0.05);
    this.add("thud", "sfx", [env(lp(noise(0.08), 0.12), 0.002, 0.8)], 0.8, 0.06);
    this.add("egg_drop", "sfx", [env(sweep(650, 220, 0.12, "sine", 0, 0, 0.6), 0.003, 0.6)], 0.7, 0.05);
    const crk = []; for (let i = 0; i < 4; i++) { crk.push(env(noise(0.012), 0.001, 0.9)); crk.push(sil(0.018)); }
    this.add("egg_crack", "sfx", [cat(...crk, env(lp(noise(0.22), 0.15), 0.005, 0.8))], 0.8, 0.05);
    this.add("point", "sfx", [lp(env(sweep(880, 1320, 0.09, "square"), 0.003, 0.5), 0.5)], 0.35, 0.04);
    this.add("combo", "sfx", [lp(cat(...[660, 880, 1100, 1320].map(f => env(sweep(f, f, 0.07, "square"), 0.003, 0.4))), 0.5)], 0.35, 0.2);
    this.add("click", "sfx", [env(sweep(1200, 800, 0.04, "tri"), 0.002, 0.6)], 0.5, 0.03);
    this.add("hurt", "sfx", [lp(env(sweep(300, 120, 0.3, "square", 30, 0.1), 0.005, 0.5), 0.4)], 0.6, 0.15);
    this.add("jump", "sfx", [env(sweep(180, 520, 0.25, "sine", 18, 0.1, 0.6), 0.005, 0.5)], 0.7, 0.1);
    const hk = env(lp(mix(sweep(392, 392, 0.18, "square"), sweep(494, 494, 0.18, "square")), 0.3), 0.01, 0.2);
    this.add("honk", "sfx", [cat(hk, sil(0.06), hk)], 0.45, 0.4);
    this.add("pickup", "sfx", [lp(cat(env(sweep(990, 990, 0.06, "square"), 0.003, 0.3), env(sweep(1480, 1480, 0.12, "square"), 0.003, 0.6)), 0.5)], 0.35, 0.05);
    this.add("vroom", "engine", [lp(env(sweep(70, 160, 0.6, "saw", 18, 0.15), 0.02, 0.5), 0.2)], 0.7, 0.5);
    // Motor döngüsü (çalma hızı arabanın hızına göre değişir)
    const eng = new Float32Array(SR); let p1 = 0, p2 = 0;
    for (let i = 0; i < SR; i++) { p1 += 48 / SR; p2 += 24 / SR; const putt = 0.6 + 0.4 * Math.sin(TAU * 8 * i / SR); eng[i] = (osc("saw", p1) * 0.6 + osc("square", p2) * 0.5) * putt; }
    this.add("engine", "engine", [lp(eng, 0.18)], 0.8);
    // Müzikler
    const mel = [72, 76, 79, 76, 77, 81, 79, null, 76, 79, 84, 79, 81, 79, 76, null, 74, 77, 81, 77, 79, 77, 76, 74, 72, 76, 79, 76, 72, null, null, null];
    const bass = [48, 48, 53, 53, 48, 48, 45, 45, 50, 50, 43, 43, 48, 43, 48, 48];
    this.add("music_calm", "music", [song(126, [["tri", 0.45, mel.map((n, i) => [i * 0.5, 0.45, n])], ["square", 0.18, bass.map((n, i) => [i, 0.9, n])]], 16, [0.05, 1])], 0.7);
    const bp = [].concat(Array(8).fill(45), Array(8).fill(41), Array(8).fill(43), Array(8).fill(40));
    const am = [69, 72, 76, 81, 79, 76, 72, 76, 77, 81, 84, 81, 79, 77, 76, 74, 76, 79, 83, 79, 74, 79, 83, 86, 76, 76, 80, 83, 88, 83, 80, 76];
    this.add("music_action", "music", [song(164, [["square", 0.22, am.map((n, i) => [i * 0.5, 0.42, n])], ["saw", 0.22, bp.map((n, i) => [i * 0.5, 0.4, n + (i % 2 ? 12 : 0)])]], 16, [0.08, 0.5])], 0.7);
    this.add("music_victory", "music", [song(140, [["square", 0.3, [[0, .25, 72], [.25, .25, 76], [.5, .25, 79], [.75, .75, 84], [1.75, .25, 79], [2, 2, 84]]], ["tri", 0.3, [[.75, .75, 76], [2, 2, 79]]], ["tri", 0.3, [[0, 1.5, 48], [1.75, 2.25, 43]]]], 4.5)], 0.7);
    const tb = [[392, .42], [370, .42], [349, .42]].map(([f, d]) => env(sweep(f, f * 0.98, d, "saw"), 0.02, 0.3));
    tb.push(env(sweep(330, 320, 1.3, "saw", 6, 0.03), 0.02, 0.4));
    this.add("music_gameover", "music", [lp(cat(...tb), 0.15)], 0.8);
  },
  play(name, vol = 1) {
    if (!this.ctx || this.muted) return;
    const c = this.catOf[name]; if (!c || !this.on[c]) return;
    const now = performance.now() / 1000;
    if (now - (this.last[name] || -99) < this.gap[name]) return;
    this.last[name] = now;
    const s = this.ctx.createBufferSource(); s.buffer = pick(this.bufs[name]);
    const gn = this.ctx.createGain(); gn.gain.value = vol; s.connect(gn); gn.connect(this.cat[c]); s.start();
  },
  music(name, loop = true) {
    if (!this.ctx) { this.pendingMusic = [name, loop]; return; }
    if (name === this.musicName && loop && this.musicSrc) return;
    this.stopMusic(); this.musicName = name; this.musicLoop = loop;
    const s = this.ctx.createBufferSource(); s.buffer = this.bufs[name][0]; s.loop = loop; s.connect(this.cat.music); s.start();
    s.onended = () => { if (this.musicSrc === s) this.musicSrc = null; };
    this.musicSrc = s;
  },
  stopMusic() { if (this.musicSrc) { try { this.musicSrc.stop(); } catch (e) {} this.musicSrc = null; } this.musicName = null; },
  engine(rate, vol = 1) {   // rate null ise motor susar
    if (!this.ctx) return;
    if (!this.engSrc) {
      this.engGain = this.ctx.createGain(); this.engGain.gain.value = 0; this.engGain.connect(this.cat.engine);

}

}

}
function drawSun(g, x, y, t) {
  for (let i = 0; i < 12; i++) {

function makeCloud(sc) {

}
class Clouds {
  constructor(n = 6) {

  }

function buildThrowBackground(seed, treeXs) {
  const rng = seeded(seed), perches = [];

  const colors = TREE_COLORS.slice(); for (let i = colors.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [colors[i], colors[j]] = [colors[j], colors[i]]; }

    }

    for (let x = 0; x < W; x += 160) rrect(g, x + 20, 75, 80, 8, 4, "#ffeb78");

const SKIN = "#ffd2aa";
function drawKid(g, x, y, f = 1, walk = 0, arm = -0.8, holding = false, hurt = 0, yolk = false) {
  const bob = Math.abs(Math.sin(walk * 2)) * 3;
  for (const side of [-1, 1]) {
    const sw = Math.sin(walk * 2 + (side < 0 ? 0 : Math.PI)) * 8;
    line(g, x + side * 6, y - 28, x + side * 6 + sw, y - 3, OUT, 9);

  rrect(g, x - 16, by - 60, 32, 36, 10, "#ff783c");
  circ(g, x, by - 42, 6, "#ffe650");
  const sh = [x - f * 8, by - 52];
  line(g, sh[0], sh[1], sh[0] - f * 6, sh[1] + 24, OUT, 9); line(g, sh[0], sh[1], sh[0] - f * 6, sh[1] + 24, SKIN, 6);

    for (const dx of [-5, 5]) { line(g, ex + dx - 3, hy - 3, ex + dx + 3, hy + 3, OUT, 2); line(g, ex + dx - 3, hy + 3, ex + dx + 3, hy - 3, OUT, 2); }
    circ(g, ex, hy + 9, 4, null, OUT, 2);
  } else {
    circ(g, ex - 5, hy - 1, 3, OUT); circ(g, ex + 5, hy - 1, 3, OUT);
    g.beginPath(); g.arc(ex, hy + 2, 6, 0.4, Math.PI - 0.4); g.lineWidth = 2; g.strokeStyle = OUT; g.stroke();
  }

  if (yolk) { ell(g, hx, hy - 19, 16, 7, 0, "#fffaeb"); circ(g, hx, hy - 20, 6, "#ffc31e"); }
  const s2 = [x + f * 10, by - 52], hand = [s2[0] + Math.cos(arm) * 28, s2[1] + Math.sin(arm) * 28];

  circ(g, hand[0], hand[1], 5, SKIN, OUT, 2);

class RoadObj {

      case "bigrock": drawStone(g, sx, gy - 24, 28, 0.5); drawStone(g, sx - 22, gy - 10, 12, 1); line(g, sx - 6, gy - 40, sx + 4, gy - 28, OUT, 2); break;
      case "egg": { const r = -t * 6; ell(g, sx, gy - 13, 10, 13, r, "#fffaeb", OUT, 2); circ(g, sx + Math.cos(r) * 4, gy - 13 + Math.sin(r) * 5, 3, "#78aaff"); break; }

        if (!this.warned && sx > 0 && sx < W) drawBubble(g, "Geçemezsin!", sx, gy - 60, "#ffdcdc");
        break;
      case "wrench": { const y = gy - 36 - this.air + Math.sin(t * 4) * 5; circ(g, sx, y, 20, "#78dc8c", OUT, 3); line(g, sx - 9, y + 9, sx + 7, y - 7, OUT, 7); line(g, sx - 9, y + 9, sx + 7, y - 7, "#e6e6f0", 4); circ(g, sx + 8, y - 8, 6, "#e6e6f0"); circ(g, sx + 11, y - 11, 3, "#78dc8c"); break; }
      case "coin": { const y = gy - 36 - this.air + Math.sin(t * 5) * 4, w = Math.abs(Math.cos(t * 3)) * 16 + 4; ell(g, sx, y, w + 2, 18, 0, OUT); ell(g, sx, y, w, 16, 0, "#ffd228"); if (w > 10) star(g, sx, y, 8, -Math.PI / 2, "#fff08c"); break; }

  }
}
class Diver {   // Uyarı işaretinden sonra arabaya dalan kuş (bazıları son anda vazgeçer)
  constructor(tx, ty, kind, speed) { Object.assign(this, { tx, ty, kind, speed, x: tx + rand(160, 300), y: -40, t: 0, alive: true, veer: Math.random() < 0.3, veered: false, passed: false, vx: 0, vy: 0, hit: false }); }
  update(dt) {
    this.t += dt; if (this.t < 0.95) return;
    if (!this.vx && !this.vy) { const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy) || 1; this.vx = dx / d * this.speed; this.vy = dy / d * this.speed; }
    if (this.veer && !this.veered && this.y > this.ty - 170) { this.veered = true; this.vx = -this.speed * 0.9; this.vy = -this.speed * 0.5; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.y > this.ty + 60 || this.x < -100 || this.y < -200) this.alive = false;
  }
  rect() { return { x: this.x - 18, y: this.y - 18, w: 36, h: 36 }; }

}

class Button {
  constructor(x, y, w, h, label, color, size = 28, icon = null) { Object.assign(this, { x, y, w, h, label, color, size, icon, pop: 0 }); }
  hit(p, pad = 8) { return p.x >= this.x - pad && p.x <= this.x + this.w + pad && p.y >= this.y - pad && p.y <= this.y + this.h + pad; }
  draw(g, dt = FPS_DT) {
    this.pop = Math.max(0, this.pop - dt * 4);
    const grow = this.pop * 6, x = this.x - grow, y = this.y - grow, w = this.w + grow * 2, h = this.h + grow * 2, r = Math.min(h / 2, 22);
    rrect(g, x, y + 5, w, h, r, shadeHex(this.color, -70));
    rrect(g, x, y, w, h, r, this.color, OUT, 3);
    rrect(g, x + 10, y + 6, w - 20, Math.max(4, h / 6), 6, shadeHex(this.color, 55));
    if (this.icon) this.icon(g, x + w / 2, y + h / 2, h);
    if (this.label) txt(g, this.label, x + w / 2, y + h / 2 + 1, this.size, WHITE);
  }
}
function shadeHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  return rgb([clamp((n >> 16) + amt, 0, 255), clamp(((n >> 8) & 255) + amt, 0, 255), clamp((n & 255) + amt, 0, 255)]);
}

  restart: (g, cx, cy, h) => { const r = h / 4; g.beginPath(); g.arc(cx, cy, r, -TAU + 0.2, -0.6); g.lineWidth = 3.5; g.strokeStyle = WHITE; g.stroke(); const tx = cx + Math.cos(-0.6) * r, ty = cy + Math.sin(-0.6) * r; poly(g, [[tx - 7, ty - 3], [tx + 5, ty - 5], [tx + 1, ty + 7]], WHITE); },

  },

    this.pause.draw(g); this.restart.draw(g); this.sound.draw(g);

class PlayScene {
  constructor(level) {
    this.level = level; this.cfg = LEVELS[level]; this.hud = new HUD(); this.fx = new Effects(); this.splats = new Splats();
    this.phase = "intro"; this.introT = 0; this.completeT = 0; this.paused = false; this.confirm = false; this.banner = null; this.summary = []; this.shake = 0;
    const cx = W / 2;
    this.pb = { resume: new Button(cx - 160, 200, 320, 64, "Devam Et", UI_GREEN, 32), restart: new Button(cx - 160, 470, 320, 58, "Yeniden Başlat", UI_ACCENT, 27), menu: new Button(cx - 160, 540, 320, 58, "Ana Menü", UI_BLUE, 27) };
    this.sp = new SoundPanel(cx - 245, 290);
    this.next = new Button(cx - 150, 520, 300, 70, "Devam Et", UI_GREEN, 32);
    this.yes = new Button(cx - 230, 380, 210, 64, "Evet", UI_ACCENT, 30);
    this.no = new Button(cx + 20, 380, 210, 64, "Hayır", UI_GREEN, 30);
  }
  togglePause() { if (this.phase === "complete") return; this.paused = !this.paused; this.confirm = false; if (this.paused) this.onPause(); }
  onPause() {}
  startPlay() { this.phase = "play"; }
  showBanner(text, time = 2.2, color = "#ffe65a") { this.banner = { text, left: time, total: time, color }; }
  complete(summary) {
    if (this.phase === "complete") return;
    this.phase = "complete"; this.completeT = 0; this.summary = summary; G.stats.levelsCompleted++;
    Snd.engine(null); Snd.music("music_victory", false);
    for (let i = 0; i < 60; i++) this.fx.add(W / 2, H / 2, Math.cos(i) * (200 + i * 6), -Math.abs(Math.sin(i * 1.7)) * 600 - 100, ["#ff5a78", "#ffdc46", "#78a0ff", "#78e68c"][i % 4], { size: 6, life: 2.2, g: 600, kind: "star", vrot: 5 });
  }
  goNext() { if (this.level >= LAST_LEVEL) G.gameOver(true); else G.startLevel(this.level + 1); }
  fail(reason) { Snd.engine(null); G.gameOver(false, reason); }

  key(code) {
    if (code === "Escape" || code === "KeyP") { this.togglePause(); return; }
    if (code === "KeyM") { Snd.toggleMute(); return; }
    if (this.paused) return;
    if (this.phase === "intro" && (code === "Space" || code === "Enter") && this.introT > 0.4) { this.startPlay(); return; }
    if (this.phase === "complete" && (code === "Space" || code === "Enter") && this.completeT > 0.8) { Snd.play("click"); this.goNext(); return; }
    if (this.phase !== "intro" && this.phase !== "complete") this.playKey(code);
  }
  down(p) {   // Dokunma / tıklama başlangıcı. true dönerse dokunuş arayüze aittir.
    if (this.paused) {
      if (this.confirm) {
        if (this.yes.hit(p)) { Snd.play("click"); G.newGame(); } else if (this.no.hit(p)) { Snd.play("click"); this.confirm = false; this.paused = false; }
        return true;
      }
      for (const [k, b] of Object.entries(this.pb)) if (b.hit(p, 4)) {
        Snd.play("click"); b.pop = 1;
        if (k === "resume") this.togglePause(); else if (k === "restart") G.newGame(); else G.toMenu();
        return true;
      }
      this.sp.tap(p); return true;
    }
    const a = this.hud.tap(p);
    if (a) {
      Snd.play("click");
      if (a === "pause") this.togglePause();
      else if (a === "restart") { this.paused = true; this.confirm = true; this.onPause(); }
      else Snd.toggleMute();
      return true;
    }
    if (this.phase === "intro") { if (this.introT > 0.4) this.startPlay(); return true; }
    if (this.phase === "complete") { if (this.completeT > 0.8 && this.next.hit(p)) { Snd.play("click"); this.goNext(); } return true; }
    return this.playDown(p);
  }
  move(p) { if (!this.paused) this.playMove(p); }
  up(p) { if (!this.paused) this.playUp(p); }
  playKey() {} playDown() { return false; } playMove() {} playUp() {}

  update(dt) {
    this.hud.update(dt);
    if (this.paused) return;
    this.shake = Math.max(0, this.shake - dt * 25);
    if (this.banner) { this.banner.left -= dt; if (this.banner.left <= 0) this.banner = null; }
    if (this.phase === "intro") { this.introT += dt; if (this.introT > 2.6) this.startPlay(); this.world(dt, false); }
    else if (this.phase === "complete") { this.completeT += dt; this.world(dt, false); }
    else this.world(dt, true);
    this.fx.update(dt); this.splats.update(dt);
  }
  draw(g) {
    this.drawWorld(g); this.fx.drawTexts(g); this.splats.draw(g);
    if (this.pad && (this.phase === "play" || this.phase === "car")) this.pad.draw(g);
    this.drawHud(g);
    if (this.banner) {
      const b = this.banner, sc = easeOutBack(Math.min(1, (b.total - b.left) / 0.35));
      g.save(); g.globalAlpha = b.left < 0.4 ? b.left / 0.4 : 1; g.translate(W / 2, 170); g.scale(sc, sc); txt(g, b.text, 0, 0, 52, b.color, { ol: 5 }); g.restore();
    }
    if (this.phase === "intro") this.drawIntro(g);
    else if (this.phase === "complete") this.drawComplete(g);
    if (this.paused) this.drawPause(g);
  }
  drawIntro(g) {
    const k = easeOutBack(Math.min(1, this.introT / 0.5)), cy = -150 + (H / 2 - 40 + 150) * k;
    panel(g, W / 2 - 400, cy - 115, 800, 230);
    txt(g, `BÖLÜM ${this.level}`, W / 2, cy - 70, 34, "#ff8c3c");
    txt(g, this.cfg.name, W / 2, cy - 12, 50, "#ffdc46", { ol: 4 });
    txt(g, this.cfg.tip, W / 2, cy + 48, 23, OUT, { ol: 0 });

  }
  drawComplete(g) {
    dim(g, Math.min(1, this.completeT * 2) * 0.45);
    const k = easeOutBack(Math.min(1, this.completeT / 0.6)), cy = -300 + (H / 2 + 300) * k, top = cy - 220;
    panel(g, W / 2 - 320, top, 640, 440);
    txt(g, "BÖLÜM TAMAMLANDI!", W / 2, top + 55, 44, "#ffd23c", { ol: 4 });
    for (let i = 0; i < 3; i++) star(g, W / 2 + (i - 1) * 80, top + 120 - Math.abs(Math.sin(this.completeT * 4 + i)) * 10, 30, -Math.PI / 2, "#ffd732", OUT);
    this.summary.forEach((l, i) => txt(g, l, W / 2, top + 185 + i * 42, 26, OUT, { ol: 0 }));
    this.next.y = top + 440 - 95; this.next.label = this.level < LAST_LEVEL ? "Devam Et" : "Sonuçlar";
    if (this.completeT > 0.8) this.next.draw(g);
  }
  drawPause(g) {
    dim(g, 0.6);
    if (this.confirm) {
      panel(g, W / 2 - 300, 220, 600, 260, "rgba(60,60,110,0.96)");
      txt(g, "Oyun baştan başlasın mı?", W / 2, 285, 36, WHITE, { ol: 3 });
      txt(g, "Puanın ve bölümlerin sıfırlanır.", W / 2, 330, 22, "#dcdcff", { ol: 0 });
      this.yes.draw(g); this.no.draw(g); return;
    }
    panel(g, W / 2 - 280, 120, 560, 520, "rgba(60,60,110,0.96)");
    txt(g, "DURAKLATILDI", W / 2, 162, 44, WHITE, { ol: 4 });
    for (const b of Object.values(this.pb)) b.draw(g);
    this.sp.draw(g);
  }
  world() {} drawWorld() {} drawHud() {}
}

// ------------------------------------------------------------- Bölüm 1-2: taş atma
class ThrowLevel extends PlayScene {
  constructor(level) {
    super(level);
    const bg = buildThrowBackground(level * 7 + 3, [555, 775, 985, 1165]);
    Object.assign(this, bg);
    this.perchOwner = this.perches.map(() => null);
    this.clouds = new Clouds(6); this.player = new Player(200);
    Object.assign(this, { birds: [], stones: [], eggs: [], chicks: [], piles: [], stonesLeft: this.cfg.stones, goal: this.cfg.goal, scaredHere: 0,
      scoreStart: G.stats.score, charging: false, charge: 0, aimId: null, aim: { x: 700, y: 300 }, combo: 0, spawnT: 1, flockT: 5, nextFlock: 1,
      helpChance: level === 1 ? 0.35 : 0.6, revenge: this.cfg.revenge, revengeOn: false, attackT: 3, diveSpeed: 1, pileT: 14, rescued: false,
      outT: 0, t: 0, throws: 0, car: null, autoBoard: false });
    for (let i = 0; i < Math.floor(this.cfg.maxBirds * 0.65); i++) this.spawnBird(null, true);
    this.pad = new TouchPad([{ id: "left", x: 80, y: 650, r: 52, label: "◀" }, { id: "right", x: 205, y: 650, r: 52, label: "▶" }]);
    Snd.music("music_calm");
  }
  // Kuşların dünyayla etkileşimi
  aimPoint() { if (this.player.hidden) return this.car ? [this.car.x, GROUND_Y - 60] : [W / 2, GROUND_Y]; return [this.aim.x, this.aim.y]; }
  playerTarget() { return [this.player.x, GROUND_Y - 50]; }
  neighborOf(bird, r) { return this.birds.find(b => b !== bird && b.state === "perched" && Math.abs(b.x - bird.x) < r && Math.abs(b.y - bird.y) < 80) || null; }
  freePerchNear(x, y, maxd) {
    const opts = []; this.perches.forEach((p, i) => { if (!this.perchOwner[i] && dist(p[0], p[1], x, y) < maxd) opts.push(i); });
    return opts.length ? pick(opts) : null;
  }
  rebuildPerches() { this.perchOwner = this.perches.map(() => null); for (const b of this.birds) if (b.perch !== null && ["perched", "hopping", "flying", "stunned"].includes(b.state)) this.perchOwner[b.perch] = b; }
  chooseKind() { const w = Object.assign({}, this.cfg.weights); if (this.birds.some(b => b.kind === "gold")) delete w.gold; return weighted(w); }
  spawnBird(kind, perched = false, near = null) {
    kind = kind || this.chooseKind();
    const idx = near ? this.freePerchNear(near[0], near[1], 420) : this.freePerchNear(W / 2, 0, 9999);
    if (idx === null) return null;
    const b = new Bird(kind, 0, 0, this.cfg.speedMult); b.perch = idx; this.perchOwner[idx] = b;
    if (perched) { [b.x, b.y] = b.perchPos(this.perches[idx]); b.set("perched"); }
    else { const side = near ? (near[0] > W / 2 ? 1 : -1) : pick([-1, 1]); b.x = side < 0 ? -30 : W + 30; b.y = rand(80, 300); b.set("flying"); }
    this.birds.push(b); return b;
  }
  spawnEgg(x, y, vx, vy, color, harmful = false) { this.eggs.push(new Egg(x, y, vx, vy, color, harmful)); if (!harmful) this.fx.text("Yumurta!", x, y - 30, "#fffadc", 19, 0.8); }
  callForHelp(bird) { const n = this.level === 1 ? randi(2, 3) : randi(3, 4); for (let i = 0; i < n; i++) this.spawnBird(null, false, [bird.x, bird.y]); if (this.revenge) this.attackT = Math.min(this.attackT, 1); }
  progress() { return Math.min(1, this.scaredHere / this.goal); }
  moveDir() { let m = 0; if (Input.held("left") || Input.key("KeyA", "ArrowLeft")) m -= 1; if (Input.held("right") || Input.key("KeyD", "ArrowRight")) m += 1; return m; }

  // Girdiler
  playKey(code) { if (this.phase === "car" && ["KeyE", "Space", "KeyW", "ArrowUp"].includes(code)) this.tryBoard(); }
  playDown(p) {
    if (this.phase === "car") {
      if (this.car && Math.abs(p.x - this.car.x) < 140 && p.y > GROUND_Y - 170) this.tryBoard(true);
      return false;
    }
    if (this.phase === "play" && this.stonesLeft > 0 && this.player.hurtT <= 0 && this.aimId === null) {
      this.charging = true; this.charge = 0; this.aimId = p.id; this.aim = { x: p.x, y: p.y };
    }
    return false;
  }
  playMove(p) { if (p.id === this.aimId || (p.mouse && !this.charging)) this.aim = { x: p.x, y: p.y }; }
  playUp(p) { if (p.id === this.aimId) { this.aim = { x: p.x, y: p.y }; if (this.charging) this.throwStone(); this.charging = false; this.aimId = null; } }
  onPause() { this.charging = false; this.aimId = null; }

  throwVel(aim = this.aim) {
    const [sx, sy] = this.player.shoulder, dx = aim.x - sx, dy = aim.y - sy, d = Math.hypot(dx, dy) || 1, sp = THROW_MIN + (THROW_MAX - THROW_MIN) * this.charge;
    return { vx: dx / d * sp, vy: dy / d * sp, x: sx + dx / d * 28, y: sy + dy / d * 28 };
  }
  throwStone() {
    if (this.stonesLeft <= 0) return;
    const v = this.throwVel(); this.stones.push(new Stone(v.x, v.y, v.vx, v.vy));
    this.stonesLeft--; this.throws++; this.player.throwT = 0.25; Snd.play("throw");
    for (const b of this.birds) if (b.state === "perched" && Math.abs(b.x - v.x) < 500) b.nervous = 0.6;
  }
  // Puanlar
  award(bird, stone, isHit = false, bonus = null) {
    if (bird.counted) return;
    bird.counted = true;
    const mult = 1 + COMBO_STEP * Math.min(this.combo, COMBO_MAX);
    let pts = bird.points + (isHit ? HIT_BONUS : 0);
    if (stone) { pts += 10 * stone.scared; stone.scared++; stone.touched.add(bird.id); }
    pts = Math.floor(pts * mult);
    G.stats.score += pts; G.stats.birdsScared++; this.scaredHere++;
    this.fx.text(`+${pts}`, bird.x, bird.y - 25, rgb(lerpC(BT[bird.kind].body, [255, 255, 255], 0.2)), pts < 100 ? 28 : 36);
    if (bonus) this.fx.text(bonus, bird.x, bird.y - 65, "#fff078", 23, 1.2);
    const names = { 2: "ÇİFTE!", 3: "ÜÇLÜ!", 4: "SÜPER!", 6: "MUHTEŞEM!" };
    if (stone && names[stone.scared]) { this.fx.text(names[stone.scared], stone.x, stone.y - 40, "#ff96dc", 32, 1.3); Snd.play("combo"); }
    if (bird.kind === "gold") this.showBanner(`ALTIN KUŞ! +${pts}`, 1.6, "#ffd73c");
    Snd.play("point");
  }
  scare(bird, stone, sx, bonus) {
    let group = [bird];
    if (bird.flockId !== null) {
      group = this.birds.filter(b => b.flockId === bird.flockId && !b.counted && b.state === "flock");
      if (group.length > 1) this.fx.text("SÜRÜ DAĞILDI!", bird.x, bird.y - 70, "#b4e6ff", 27, 1.3);
      if (!group.length) group = [bird];
    }
    for (const b of group) { this.award(b, stone, false, bonus); b.flee(sx); this.fx.feathers(b.x, b.y, rgb(BT[b.kind].body), 3); }
    Snd.play("flap"); Snd.play("chirp_" + bird.kind);
  }
  hitBird(bird, stone) {
    this.award(bird, stone, true, "İSABET!");
    stone.deflect(); Snd.play("hit"); Snd.play("cry");
    this.fx.stars(bird.x, bird.y - 10, 7); this.fx.feathers(bird.x, bird.y, rgb(BT[bird.kind].body), 6);
    this.fx.text(pick(["BONK!", "TONK!", "PAT!"]), bird.x + 30, bird.y - 40, WHITE, 24, 0.7, 40);
    this.shake = Math.max(this.shake, 4);
    if (["diving", "bomber", "flock"].includes(bird.state)) { bird.flee(stone.x); this.fx.text("Savuşturuldu!", bird.x, bird.y - 70, "#a0ffa0", 24, 1.2); return; }
    bird.stun();
    for (const o of this.birds) if (o !== bird && o.isTarget() && dist(o.x, o.y, bird.x, bird.y) < 140) this.scare(o, stone, bird.x, "Panik!");
  }
  resolveStone(s) {
    s.resolved = true;
    if (s.scared > 0) {
      this.combo++; G.stats.bestCombo = Math.max(G.stats.bestCombo, this.combo);
      if (this.combo >= 2) { this.fx.text(`KOMBO x${(1 + COMBO_STEP * Math.min(this.combo, COMBO_MAX)).toFixed(1)}!`, s.x, GROUND_Y - 80, "#ff82d2", 30, 1.3); Snd.play("combo"); }
    } else { if (this.combo >= 2) this.fx.text("Seri bitti", s.x, GROUND_Y - 60, "#dcdce6", 20, 0.9); this.combo = 0; }
  }
  damage(amount, text = "Ah!") {
    const p = this.player; if (p.invT > 0 || p.hidden) return;
    G.stats.health = Math.max(0, G.stats.health - amount);
    p.hurtT = 0.6; p.invT = 1.3; this.charging = false; this.aimId = null; this.shake = 9; Snd.play("hurt");
    this.fx.text(text, p.x, GROUND_Y - 120, "#ff7878", 27, 0.9); this.fx.feathers(p.x, GROUND_Y - 80, WHITE, 5);
    if (G.stats.health <= 0) this.fail("Kuşlar seni yakaladı!");
  }

  world(dt, active) {
    this.t += dt; this.clouds.update(dt);
    if (this.charging) this.charge = Math.min(1, this.charge + dt / CHARGE_TIME);
    let move = active && !this.player.hidden ? this.moveDir() : 0;
    if (this.autoBoard && this.car && this.car.state === "wait") { move = Math.sign(this.car.x - this.player.x); if (Math.abs(this.car.x - this.player.x) < 110) this.tryBoard(); }
    this.player.update(dt, move, this.charging ? [this.aim.x, this.aim.y] : this.aimPoint(), this.charging);
    const playing = active && (this.phase === "play" || this.phase === "car");
    if (playing) { this.spawning(dt); if (this.revenge) this.revengeTick(dt); this.pickups(dt); }
    this.rebuildPerches();
    for (const b of this.birds) b.update(dt, this);
    this.birds = this.birds.filter(b => b.alive);
    const hb = this.player.hitbox();
    for (const b of this.birds) if (b.state === "diving" && b.st > 0.7 && hit({ x: hb.x - b.size / 2, y: hb.y - b.size / 2, w: hb.w + b.size, h: hb.h + b.size }, b.x, b.y)) { this.damage(this.phase === "car" ? 4 : 9, pick(["Ay!", "Gak!", "Of!"])); b.retreat(); }
    this.updStones(dt); this.updEggs(dt);
    for (const c of this.chicks) c.update(dt); this.chicks = this.chicks.filter(c => c.alive);
    if (this.phase === "car") this.updCar(dt);
    if (!playing || this.phase !== "play") return;
    if (this.scaredHere >= this.goal) { if (this.level === 2) this.startCar(); else this.finish(); return; }
    if (this.stonesLeft === 0 && !this.stones.some(s => s.flying)) {
      if (!this.rescued) { this.rescued = true; this.spawnPile(5, true); }
      else if (!this.piles.length) { this.outT += dt; if (this.outT > 1.5) this.fail("Taşların bitti!"); }
    } else this.outT = 0;
  }
  spawning(dt) {
    const c = this.cfg; this.spawnT -= dt;
    const resting = this.birds.filter(b => ["perched", "hopping", "flying", "stunned"].includes(b.state)).length;
    const extra = this.revenge ? Math.floor(this.progress() * 6) : 0;
    if (this.spawnT <= 0 && resting < c.maxBirds + extra) { this.spawnBird(); this.spawnT = c.spawnEvery * rand(0.7, 1.3); }
    if (c.flocks) { this.flockT -= dt; if (this.flockT <= 0) { this.flockT = rand(7, 11); this.spawnFlock(); } }
  }
  spawnFlock() {
    const n = randi(5, 7), d = pick([-1, 1]), kind = pick(["blue", "yellow", "red"]), baseY = rand(110, 210), fid = this.nextFlock++;
    for (let i = 0; i < n; i++) {
      const b = new Bird(kind, 0, 0, this.cfg.speedMult);
      b.x = d > 0 ? -60 - i * 45 : W + 60 + i * 45; b.baseY = baseY + (i % 2) * 35 + Math.floor(i / 2) * 6; b.y = b.baseY;
      b.vx = d * 170 * this.cfg.speedMult; b.t = i * 0.3; b.flockId = fid; b.set("flock"); this.birds.push(b);
    }
    Snd.play("flap");
  }
  revengeTick(dt) {
    const p = this.progress();
    if (!this.revengeOn && (p >= 0.2 || this.t > 25)) { this.revengeOn = true; this.showBanner("KUŞLAR İNTİKAM İSTİYOR!", 2.6, "#ff6e6e"); Snd.music("music_action"); Snd.play("angry"); }
    if (!this.revengeOn) return;
    this.diveSpeed = 1 + p * 0.7; this.attackT -= dt; if (this.attackT > 0) return;
    this.attackT = (this.phase === "car" ? 1.1 : Math.max(1.3, 3.8 - p * 2.3)) * rand(0.8, 1.2);
    if (Math.random() < 0.65) {
      const perched = this.birds.filter(b => b.state === "perched"); let b;
      if (perched.length) { b = pick(perched); b.perch = null; } else { b = new Bird(this.chooseKind(), rand(300, W - 100), -30, this.cfg.speedMult); this.birds.push(b); }
      b.diveTarget = null; b.set("diving");
    } else {
      const d = pick([-1, 1]), b = new Bird(pick(["red", "yellow"]), d > 0 ? -40 : W + 40, 0, this.cfg.speedMult);
      b.baseY = rand(110, 170); b.y = b.baseY; b.vx = d * rand(230, 300); b.set("bomber"); this.birds.push(b); Snd.play("angry");
    }
  }
  updStones(dt) {
    for (const s of this.stones) {
      if (s.update(dt) === "bounce") { Snd.play("thud", 0.6); this.fx.dust(s.x, GROUND_Y, 5); }
      if (s.flying) for (const b of this.birds) {
        if (s.touched.has(b.id) || !b.isTarget()) continue;
        const d = dist(s.x, s.y, b.x, b.y);
        if (d < b.size + s.r + 3) this.hitBird(b, s);
        else if (d < BT[b.kind].scare * TOUCH_SCARE * (["diving", "bomber"].includes(b.state) ? 0.6 : 1)) this.scare(b, s, s.x);
        else if (d < 230 && b.state === "perched") b.nervous = 0.4;
      }
      if (!s.flying && !s.resolved) this.resolveStone(s);
    }
    this.stones = this.stones.filter(s => s.alive);
  }
  updEggs(dt) {
    const hb = this.player.hitbox();
    for (const e of this.eggs) {
      const ev = e.update(dt);
      if (e.harmful && e.state === "fall" && !this.player.hidden && hit(hb, e.x, e.y)) {
        e.alive = false; Snd.play("egg_crack"); this.fx.yolk(e.x, e.y, GROUND_Y);
        if (this.player.invT <= 0) { this.player.slowT = 2.5; this.splats.add(); this.damage(5, "Yumurta!"); }
        continue;
      }
      if (ev === "land") { Snd.play("egg_drop"); this.fx.dust(e.x, GROUND_Y, 3, "#fffff0"); }
      else if (ev === "crack") {
        e.alive = false; Snd.play("egg_crack"); this.fx.yolk(e.x, e.y, GROUND_Y); this.fx.text("ÇAT!", e.x, e.y - 30, "#ffdc50", 25, 0.8);
        if (!e.harmful || Math.random() < 0.4) this.chicks.push(new Chick(e.x));
      }
    }
    this.eggs = this.eggs.filter(e => e.alive);
  }
  spawnPile(n = 5, rescue = false) { const x = rand(90, 440); this.piles.push({ x, n, t: 0 }); if (rescue) this.showBanner("Son şans! Taşları topla!", 2.4, "#ffdc78"); this.fx.dust(x, GROUND_Y, 8); }
  pickups(dt) {
    if (this.phase !== "play") return;
    this.pileT -= dt;
    if (this.pileT <= 0) { this.pileT = rand(13, 18); if (this.stonesLeft < 15 && this.piles.length < 2) this.spawnPile(randi(3, 5)); }
    for (const p of this.piles) {
      p.t += dt;
      if (Math.abs(p.x - this.player.x) < 34) { const n = p.n; p.n = 0; this.stonesLeft += n; Snd.play("pickup"); this.fx.text(`+${n} Taş`, p.x, GROUND_Y - 110, "#dcdcf0", 24); }
    }
    this.piles = this.piles.filter(p => p.n > 0);
  }
  startCar() {
    this.phase = "car"; this.charging = false; this.aimId = null;
    this.car = { x: -180, state: "arrive", t: 0, wheel: 0, boarded: false };
    this.showBanner("Çabuk, arabaya bin!", 3, "#ffe65a"); Snd.play("honk"); this.attackT = 1.5;
    for (let i = 0; i < 6; i++) this.spawnBird();
  }
  tryBoard(fromTap = false) {
    const c = this.car; if (!c || c.state !== "wait") { if (fromTap) this.autoBoard = true; return; }
    if (Math.abs(this.player.x - c.x) < 120) {
      c.state = "leave"; c.boarded = true; c.t = 0; this.player.hidden = true; this.autoBoard = false;
      Snd.play("vroom"); Snd.play("honk"); this.fx.text("Hadi gidelim!", c.x, GROUND_Y - 170, WHITE, 28);
    } else if (fromTap) this.autoBoard = true;   // Dokununca çocuk arabaya kendisi yürür
    else this.fx.text("Arabaya yaklaş!", this.player.x, GROUND_Y - 130, "#ffe678", 21, 0.8);
  }
  updCar(dt) {
    const c = this.car; c.t += dt;
    if (c.state === "arrive") { c.x += 420 * dt; c.wheel += 420 * dt / 21; if (c.x >= 330) { c.x = 330; c.state = "wait"; this.fx.dust(c.x - 100, GROUND_Y, 8); } }
    else if (c.state === "leave") {
      const sp = 200 + c.t * 700; c.x += sp * dt; c.wheel += sp * dt / 21;
      if (Math.random() < 0.5) this.fx.add(c.x - 115, GROUND_Y - 25, -80, -30, "#d2d2dc", { size: 8, life: 0.6, kind: "smoke" });
      if (c.x > W + 200) this.finish();
    }
  }
  finish() {
    const bonus = this.stonesLeft * 5; G.stats.score += bonus;
    this.complete([`Kaçan kuş: ${this.scaredHere}`, `Kalan taş bonusu: +${bonus}`, `Bu bölümde kazanılan: ${G.stats.score - this.scoreStart} puan`]);
  }
  drawWorld(g) {
    blitL(g, this.sky, 0, 0); drawSun(g, 110, 125, this.t); this.clouds.draw(g); blitL(g, this.scene, 0, 0);
    for (const p of this.piles) {
      [[-10, 0], [8, 0], [0, -10]].forEach(([dx, dy], i) => drawStone(g, p.x + dx, GROUND_Y - 8 + dy, 9, i));
      txt(g, "Taş!", p.x, GROUND_Y - 45 + Math.sin(p.t * 5) * 3, 19, WHITE);
    }
    for (const c of this.chicks) c.draw(g);
    for (const e of this.eggs) e.draw(g);
    if (this.car) drawCar(g, this.car.x, GROUND_Y + 6, this.car.wheel, this.car.boarded);
    const aiming = this.charging && this.phase === "play";
    this.player.draw(g, aiming || (this.stonesLeft > 0 && this.player.throwT <= 0));
    if (this.car && this.car.state === "wait") {
      const bob = Math.abs(Math.sin(this.t * 5)) * 10, x = this.car.x;
      poly(g, [[x - 18, GROUND_Y - 200 - bob], [x + 18, GROUND_Y - 200 - bob], [x, GROUND_Y - 170 - bob]], "#ffe63c", OUT, 2);
      txt(g, TOUCH ? "ARABAYA DOKUN!" : "ARABAYA BİN! (E / Boşluk)", x + 40, GROUND_Y - 225 - bob, 25, "#fff078");
    }
    const order = this.birds.slice().sort((a, b) => (["perched", "stunned"].includes(a.state) ? 0 : 1) - (["perched", "stunned"].includes(b.state) ? 0 : 1));
    for (const b of order) b.draw(g);
    for (const s of this.stones) s.draw(g);
    this.fx.draw(g);
    if (aiming) this.drawAim(g);
    if (this.phase === "play" && this.throws < 2 && this.level === 1)
      txt(g, TOUCH ? "Ekrana BAS ve TUT: güç topla  •  Parmağını kaydır: nişan al  •  BIRAK: fırlat" : "Fareye BASILI TUT: güç topla  •  BIRAK: taşı fırlat  •  A/D: yürü", W / 2 + (TOUCH ? 120 : 0), H - 34, 21, WHITE);
  }
  drawAim(g) {
    const v = this.throwVel(), steps = Math.floor(this.cfg.preview * (TOUCH ? 1.3 : 1) / 0.04);
    for (let i = 1; i < steps; i++) {
      const t = i * 0.04, px = v.x + v.vx * t, py = v.y + v.vy * t + 0.5 * GRAVITY * t * t;
      if (py > GROUND_Y) break;
      const r = Math.max(2, 5 - Math.floor(i / 6)); circ(g, px, py, r + 1, OUT); circ(g, px, py, r, WHITE);

  }

}

// ------------------------------------------------------------- Bölüm 3: araba kaçışı
class EscapeLevel extends PlayScene {
  constructor() {
    super(3);
    Object.assign(this, buildRoadLayers(11));
    Object.assign(this, { clouds: new Clouds(6), length: this.cfg.length, cam: 0, car: new Car(300), objs: [], divers: [], bombers: [], airEggs: [], swarm: new Swarm(),
      nextObj: 1100, diverT: 3.5, bomberT: 9, distAcc: 0, finishSpawned: false, coins: 0, dodges: 0, t: 0, playT: 0 });
    G.stats.health = MAX_HEALTH;
    this.pad = new TouchPad([
      { id: "left", x: 80, y: 640, r: 52, label: "◀" }, { id: "right", x: 205, y: 640, r: 52, label: "▶" },
      { id: "brake", x: 935, y: 650, r: 50, label: "FREN", size: 19 }, { id: "gas", x: 1060, y: 640, r: 58, label: "GAZ", size: 23 },
      { id: "jump", x: 1190, y: 555, r: 62, label: "ZIPLA", size: 21 },
    ]);
    Snd.music("music_action");
  }
  startPlay() { super.startPlay(); this.showBanner("KAÇ!", 1.5, "#ff785a"); Snd.play("honk"); Snd.play("vroom"); }
  doJump() { if (this.car.jump()) { Snd.play("jump"); this.fx.dust(this.car.x - 60, CAR_GROUND, 6); } }
  playKey(code) { if (code === "Space") this.doJump(); else if (code === "KeyW" || code === "ArrowUp") Snd.play("vroom", 0.7); }
  playDown(p) { const b = this.pad.find(p); if (b === "jump") this.doJump(); if (b === "gas") Snd.play("vroom", 0.7); return !!b; }
  controls() {
    return { accel: Input.held("gas") || Input.key("KeyW", "ArrowUp"), brake: Input.held("brake") || Input.key("KeyS", "ArrowDown"),
             left: Input.held("left") || Input.key("KeyA", "ArrowLeft"), right: Input.held("right") || Input.key("KeyD", "ArrowRight") };
  }
  progress() { return Math.min(1, this.cam / this.length); }
  onPause() { Snd.engine(null); }
  hurt(amount, text) {
    const c = this.car; if (c.invT > 0) return false;
    G.stats.health = Math.max(0, G.stats.health - amount); c.damage(); this.shake = 10; Snd.play("hurt");
    this.fx.text(text, c.x, CAR_GROUND - 150, "#ff7878", 27, 0.9); this.fx.feathers(c.x, CAR_GROUND - 80, WHITE, 4);
    if (G.stats.health <= 0) this.fail("Araba kuşlara yenildi!");
    return true;
  }
  addPts(pts, text, x, y, color = "#fff078") { G.stats.score += pts; this.fx.text(`${text} +${pts}`, x, y, color, 24, 1.0); Snd.play("point"); }
  spawnObjs() {
    const p = this.progress();
    while (this.nextObj < this.cam + W + 200 && this.nextObj < this.length - 400) {
      const wx = this.nextObj, kind = weighted({ rock: 30, bigrock: 8 + 16 * p, egg: 14, puddle: 12, birdblock: 12 + 12 * p, coin: 20, wrench: 6 });
      if (kind === "coin") { const air = pick([0, 0, 110]); for (let i = 0, n = randi(3, 5); i < n; i++) this.objs.push(new RoadObj("coin", wx + i * 55, air)); }
      else {
        this.objs.push(new RoadObj(kind, wx));
        if ((kind === "rock" || kind === "bigrock") && Math.random() < 0.45) for (let i = 0; i < 3; i++) this.objs.push(new RoadObj("coin", wx - 55 + i * 55, 120 + (i === 1 ? 30 : 0)));
      }
      this.nextObj += Math.max(320, rand(430, 720) * (1 - 0.35 * p));
    }
    if (!this.finishSpawned && this.cam + W + 200 > this.length) { this.finishSpawned = true; this.objs.push(new RoadObj("finish", this.length)); }
  }
  spawnAir(dt) {
    const p = this.progress(); if (p > 0.96) return;
    this.diverT -= dt;
    if (this.diverT <= 0) { this.diverT = Math.max(1.1, 3.3 - 2.2 * p) * rand(0.8, 1.2); this.divers.push(new Diver(clamp(this.car.x + rand(-60, 180), 160, W - 200), CAR_GROUND - 70, pick(["blue", "yellow", "red", "red"]), 520 + 320 * p)); Snd.play("angry", 0.6); }
    if (this.playT > 8) { this.bomberT -= dt; if (this.bomberT <= 0) { this.bomberT = Math.max(3, 8 - 4.5 * p) * rand(0.8, 1.2); this.bombers.push(new Bomber(rand(110, 190), pick(["yellow", "red"]), 260 + 140 * p)); } }
  }
  world(dt) {
    this.t += dt; const car = this.car;
    if (this.phase === "intro") { car.speed = 0; this.clouds.update(dt); Snd.engine(0.8, 0.5); return; }
    if (this.phase === "complete") { car.speed = CAR_CRUISE; car.x += 260 * dt; car.update(dt, {}); this.cam += car.speed * dt; this.clouds.update(dt, car.speed); this.divers = []; this.bombers = []; return; }
    this.playT += dt;
    if (car.update(dt, this.controls()) === "land") { this.fx.dust(car.x - 60, CAR_GROUND, 6); this.fx.dust(car.x + 60, CAR_GROUND, 6); Snd.play("thud", 0.6); }
    this.cam += car.speed * dt; this.clouds.update(dt, car.speed);
    const ratio = (car.speed - 160) / (CAR_MAXS - 160);
    Snd.engine(0.8 + ratio * 1.3, 0.6 + 0.4 * ratio);
    this.distAcc += car.speed * dt / 12 * (1 + ratio);
    if (this.distAcc >= 1) { G.stats.score += Math.floor(this.distAcc); this.distAcc -= Math.floor(this.distAcc); }
    if (Math.random() < 0.4) this.fx.add(car.x - 118, car.y - 30, -car.speed * 0.3 - 40, -20, "#d2d2dc", { size: 7, life: 0.5, kind: "smoke" });
    this.spawnObjs(); this.spawnAir(dt); this.updObjs(dt); this.updAir(dt); this.updSwarm(dt);
    if (this.cam + car.x >= this.length) this.finish();
  }
  updObjs(dt) {
    const car = this.car, low = car.low(), body = car.body();
    for (const o of this.objs) {
      o.update(dt, this.cam, car.x, this.fx);
      if (o.hit || o.kind === "finish") continue;
      const r = o.rect(this.cam), k = o.kind, cx = r.x + r.w / 2;
      if (k === "coin" || k === "wrench") {
        if (overlap(body, r)) {
          o.hit = true; o.alive = false; Snd.play("pickup");
          if (k === "coin") { this.coins++; this.addPts(50, "Yıldız", cx, r.y - 10); this.fx.stars(cx, r.y + r.h / 2, 5); }
          else { G.stats.health = Math.min(MAX_HEALTH, G.stats.health + 25); this.fx.text("Tamir +25", cx, r.y - 20, "#8cffa0", 27); }
        }
        continue;
      }
      if (overlap(low, r)) {
        o.hit = true;
        if (k === "rock") { this.hurt(12, "Taş!"); this.fx.dust(cx, CAR_GROUND, 10, "#aaaab4"); Snd.play("thud"); o.alive = false; }
        else if (k === "bigrock") { this.hurt(18, "Koca taş!"); this.fx.dust(cx, CAR_GROUND, 14, "#aaaab4"); Snd.play("hit"); o.alive = false; }
        else if (k === "egg") { Snd.play("egg_crack"); this.fx.yolk(cx, CAR_GROUND - 15, CAR_GROUND); this.splats.add(2.0); car.splatT = 2.5; car.slowT = Math.max(car.slowT, 1); if (car.invT <= 0) this.hurt(4, "Yumurta!"); o.alive = false; }
        else if (k === "puddle") { car.slowT = Math.max(car.slowT, 1.6); car.speed *= 0.8; this.fx.text("Kaygan!", cx, CAR_GROUND - 120, "#ffe678", 24, 0.8); }
        else if (k === "birdblock") { this.hurt(10, "Kuş barikatı!"); for (const b of o.birds) if (!b.fly) { b.fly = true; b.vy = -450; b.stay = false; } this.fx.feathers(cx, CAR_GROUND - 30, WHITE, 10); Snd.play("flap"); }
      } else if (r.x + r.w < car.x - 110 && ["rock", "bigrock", "egg", "birdblock"].includes(k) && !o.passed) {
        o.passed = true;
        if (k !== "birdblock" || o.birds.some(b => b.stay && !b.fly)) { this.dodges++; G.stats.score += 10; if (!car.onGround) this.fx.text("Süper zıplama! +10", car.x, CAR_GROUND - 170, "#a0e6ff", 22, 0.9); }
      }
    }
    this.objs = this.objs.filter(o => o.alive);
  }
  updAir(dt) {
    const car = this.car, body = car.body();
    for (const d of this.divers) {
      d.update(dt); if (d.t < 0.95 || d.hit) continue;
      if (!d.veered && overlap(body, d.rect())) { d.hit = true; d.alive = false; this.hurt(10, "Dalış saldırısı!"); this.fx.feathers(d.x, d.y, WHITE, 6); }
      else if (d.veered && !d.passed && Math.abs(d.x - car.x) < 200) { d.passed = true; this.addPts(25, "Kıl payı!", car.x, CAR_GROUND - 190, "#ffb4dc"); }
      else if (!d.veered && !d.passed && d.y > d.ty + 20) { d.passed = true; this.dodges++; this.addPts(15, "Atlattın!", d.x, d.y - 40, "#b4ffb4"); }
    }
    this.divers = this.divers.filter(d => d.alive);
    for (const b of this.bombers) b.update(dt, car, (x, y) => this.airEggs.push({ x, y, vx: -60, vy: 50, rot: 0, alive: true }));
    this.bombers = this.bombers.filter(b => b.alive);
    for (const e of this.airEggs) {
      e.vy += 900 * dt; e.x += e.vx * dt; e.y += e.vy * dt; e.rot += dt * 8;
      if (overlap(body, { x: e.x - 9, y: e.y - 12, w: 18, h: 24 })) {
        e.alive = false; Snd.play("egg_crack"); this.fx.yolk(e.x, e.y, CAR_GROUND); this.splats.add(); car.splatT = 3;
        this.fx.text("Görüş kapandı!", car.x, CAR_GROUND - 170, "#ffe678", 22, 1); if (car.invT <= 0) this.hurt(3, "Yumurta!");
      } else if (e.y >= CAR_GROUND - 6) { e.alive = false; Snd.play("egg_crack", 0.6); this.fx.yolk(e.x, CAR_GROUND - 6, CAR_GROUND); this.objs.push(new RoadObj("puddle", this.cam + e.x)); }
    }
    this.airEggs = this.airEggs.filter(e => e.alive);
  }
  updSwarm(dt) {
    if (this.playT < 2.5) return;
    this.swarm.update(dt, this.car.speed, this.progress());
    if (this.swarm.x > this.car.x - 110 && this.hurt(6, "Gagalıyorlar!")) { this.swarm.x -= 220; Snd.play("angry"); }
  }
  finish() {
    const bonus = G.stats.health * 5; G.stats.score += bonus + 500;
    this.complete(["BİTİŞ ÇİZGİSİ! +500", `Dayanıklılık bonusu: +${bonus}`, `Yıldız: ${this.coins}   Atlatılan engel: ${this.dodges}`]);
    Snd.play("honk");
  }
  tile(g, c, factor, y = 0) { const off = ((-this.cam * factor) % W + W) % W; blitL(g, c, off - W, y); blitL(g, c, off, y); }
  drawWorld(g) {
    blitL(g, this.sky, 0, 0); drawSun(g, 1120, 125, this.t); this.clouds.draw(g);
    this.tile(g, this.hills, 0.15); this.tile(g, this.trees, 0.45); this.tile(g, this.road, 1, ROAD_Y - 40);
    const car = this.car;
    if (car.speed > 480) { const k = (car.speed - 480) / (CAR_MAXS - 480); for (let i = 0; i <= 6 * k; i++) { const y = (i * 97 + this.t * 900) % 420 + 120, x = ((i * 263 - this.t * 2600) % W + W) % W; line(g, x, y, x + 80, y, WHITE, 2); } }
    for (const o of this.objs) o.draw(g, this.cam);
    for (const e of this.airEggs) ell(g, e.x, e.y, 9, 12, e.rot, "#fffaeb", OUT, 2);
    const sw = Math.max(60, 210 - (CAR_GROUND - car.y) * 0.4);
    ell(g, car.x, CAR_GROUND + 1, sw / 2, 7, 0, "rgba(0,0,0,0.27)");
    car.draw(g); this.swarm.draw(g);
    for (const d of this.divers) d.draw(g);
    for (const b of this.bombers) b.draw(g);
    this.fx.draw(g);
    if (this.phase === "play" && this.swarm.x > car.x - 330 && Math.floor(this.t * 4) % 2 === 0) txt(g, TOUCH ? "Sürü yaklaşıyor! GAZ'a bas!" : "Sürü yaklaşıyor! HIZLAN (W)!", W / 2, 120, 28, "#ff7878");
    if (this.phase === "play" && this.playT < 6 && !TOUCH) txt(g, "W: hızlan  •  S: yavaşla  •  A/D: ileri-geri  •  BOŞLUK: zıpla", W / 2, H - 24, 21, WHITE);
  }
  drawHud(g) { this.hud.draw(g, { level: 3, name: this.cfg.name, speed: Math.floor(this.car.speed * 0.25), healthLabel: "Dayanıklılık", progress: this.progress() }); }
}

    Object.assign(this, { win, reason, t: 0, shake: 0, fx: new Effects(), clouds: new Clouds(5), newRecord: G.stats.score > 0 && G.stats.score >= G.best });
    const cx = W / 2;
    this.btns = win ? { new: new Button(cx - 330, 600, 310, 64, "Tekrar Oyna", UI_GREEN, 28), menu: new Button(cx + 20, 600, 310, 64, "Ana Menü", UI_BLUE, 28) }
      : { retry: new Button(cx - 490, 600, 310, 64, "Bölümü Tekrar Dene", UI_GREEN, 25), new: new Button(cx - 155, 600, 310, 64, "Yeniden Başla", UI_ACCENT, 27), menu: new Button(cx + 180, 600, 310, 64, "Ana Menü", UI_BLUE, 27) };
    Snd.music(win ? "music_victory" : "music_gameover", false);
  }
  key(code) { if (code === "Enter" || code === "Space" || code === "KeyR") G.newGame(); else if (code === "Escape") G.toMenu(); }
  down(p) {
    if (this.t < 0.6) return true;
    for (const [k, b] of Object.entries(this.btns)) if (b.hit(p)) { Snd.play("click"); if (k === "new") G.newGame(); else if (k === "retry") G.retryLevel(); else G.toMenu(); break; }
    return true;
  }
  move() {} up() {}
  update(dt) {
    this.t += dt; this.clouds.update(dt);
    if (this.win && Math.random() < 12 * dt) this.fx.add(rand(0, W), -10, rand(-40, 40), rand(60, 160), pick(["#ff5a78", "#ffdc46", "#78a0ff", "#78e68c"]), { size: randi(4, 7), life: 4, g: 40, kind: "star", vrot: 4 });
    this.fx.update(dt);
  }
  draw(g) {
    blitL(g, this.sky, 0, 0); this.clouds.draw(g); blitL(g, this.scene, 0, 0);
    ["blue", "yellow", "red", "gold", "blue"].forEach((k, i) => {
      const x = 150 + i * 250, y = GROUND_Y - 30 - Math.abs(Math.sin(this.t * (this.win ? 2 : 3) + i)) * (this.win ? 6 : 25);
      drawBird(g, k, x, y, i % 2 ? 1 : -1, this.t * 4, false, this.win ? "cry" : "angry", [0, 0], this.t, 1.6);
      if (this.win) { const px = x + 30, w = Math.sin(this.t * 6 + i) * 4; line(g, px, y - 10, px, y - 70, OUT, 3); poly(g, [[px, y - 70], [px + 30, y - 64 + w], [px, y - 52]], WHITE, OUT, 2); }
    });
    this.fx.draw(g);
    const k = easeOutBack(Math.min(1, this.t / 0.6)), cy = -300 + (H / 2 - 30 + 300) * k, top = cy - 225, s = G.stats;
    panel(g, W / 2 - 380, top, 760, 450);
    txt(g, this.win ? "TEBRİKLER! KAÇTIN!" : "OYUN BİTTİ", W / 2, top + 55, 52, this.win ? "#ffc832" : "#ff6464", { ol: 4 });
    txt(g, this.win ? "Kuşlar pes etti ve beyaz bayrak salladı!" : (this.reason || "Kuşlar bu sefer kazandı!"), W / 2, top + 108, 24, OUT, { ol: 0 });
    [["Toplam Puan", s.score], ["Kaçan Kuş Sayısı", s.birdsScared], ["Tamamlanan Bölüm", `${s.levelsCompleted} / ${LAST_LEVEL}`], ["En İyi Kombo", s.bestCombo], ["Rekor", G.best]]
      .forEach(([l, v], i) => { const y = top + 170 + i * 46; txt(g, l, W / 2 - 260, y, 27, OUT, { ol: 0, align: "left" }); txt(g, String(v), W / 2 + 260, y, 30, "#ff8c3c", { align: "right" }); });
    if (this.newRecord && Math.floor(this.t * 3) % 2 === 0) txt(g, "YENİ REKOR!", W / 2 + 300, top + 18, 30, "#ff5aa0", { ol: 3 });
    if (this.t > 0.6) for (const b of Object.values(this.btns)) b.draw(g);
  }
}

// =====================================================================
//  OYUN YÖNETİCİSİ ve DÖNGÜ
// =====================================================================
const G = {
  stats: null, best: parseInt(storeGet("ki_best", "0"), 10) || 0, scene: null, checkpoint: null,
  resetStats() { this.stats = { score: 0, birdsScared: 0, levelsCompleted: 0, health: MAX_HEALTH, level: 1, bestCombo: 0 }; },
  startLevel(n) {
    this.stats.level = n; this.checkpoint = { ...this.stats }; Snd.engine(null);
    Input.ptrs.forEach(p => { p.btn = null; });
    this.scene = LEVELS[n].kind === "throw" ? new ThrowLevel(n) : new EscapeLevel();
  },
  newGame() { this.resetStats(); this.startLevel(1); },   // Bütün değerler sıfırlanır
  retryLevel() { const lv = this.checkpoint.level; this.stats = { ...this.checkpoint, health: MAX_HEALTH }; this.startLevel(lv); },
  toMenu() { Snd.engine(null); this.scene = new MenuScene(); },
  gameOver(win, reason = "") {
    if (this.stats.score > this.best) { this.best = this.stats.score; storeSet("ki_best", String(this.best)); }
    Snd.engine(null); this.scene = new GameOverScene(win, reason);
  },
};

const cv = document.getElementById("game"), ctx = cv.getContext("2d");
let S = 1, OX = 0, OY = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR); cv.style.width = w + "px"; cv.style.height = h + "px";
  S = Math.min(w / W, h / H); OX = (w - W * S) / 2; OY = (h - H * S) / 2;
}
const portrait = () => TOUCH && window.innerHeight > window.innerWidth;
function toLogical(e) { return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S, id: e.pointerId, mouse: e.pointerType === "mouse" }; }

cv.addEventListener("pointerdown", e => {
  e.preventDefault(); Snd.unlock();
  if (e.pointerType === "touch") Input.touchSeen = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = toLogical(e); Input.last = p;
  if (portrait()) return;
  const sc = G.scene, padBtn = sc.pad && (sc.phase === "play" || sc.phase === "car") && !sc.paused && Input.touchSeen ? sc.pad.find(p) : null;
  Input.ptrs.set(e.pointerId, { x: p.x, y: p.y, btn: padBtn });
  if (padBtn) { if (sc instanceof EscapeLevel) sc.playDown(p); return; }   // Ekran düğmesi: basılı tutulduğu sürece etkin
  sc.down(p);
}, { passive: false });
cv.addEventListener("pointermove", e => {
  const p = toLogical(e); Input.last = p;
  const rec = Input.ptrs.get(e.pointerId);
  if (rec) { rec.x = p.x; rec.y = p.y; if (rec.btn) return; }
  if (G.scene.move) G.scene.move(p);
});
const endPtr = e => {
  const rec = Input.ptrs.get(e.pointerId); Input.ptrs.delete(e.pointerId);
  const p = toLogical(e);
  if (rec && rec.btn) return;
  if (G.scene.up) G.scene.up(p);
};
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
// iOS'ta ses ancak bir dokunuşun sonunda açılabiliyor
document.addEventListener("touchend", () => Snd.unlock(), { passive: true });
document.addEventListener("click", () => Snd.unlock());
cv.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
window.addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  Snd.unlock();
  if (!e.repeat) G.scene.key(e.code);
  Input.keys.add(e.code);
});
window.addEventListener("keyup", e => Input.keys.delete(e.code));
window.addEventListener("blur", () => { Input.keys.clear(); Input.ptrs.clear(); autoPause(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { autoPause(); if (Snd.ctx) Snd.ctx.suspend().catch(() => {}); }
  else if (Snd.ctx) Snd.ctx.resume().catch(() => {});
});
function autoPause() { const s = G.scene; if (s && s.togglePause && !s.paused && (s.phase === "play" || s.phase === "car")) s.togglePause(); }
window.addEventListener("resize", resize);

function drawRotateHint(g) {
  g.fillStyle = "#1b2440"; g.fillRect(-W, -H, W * 3, H * 3);
  const t = performance.now() / 1000, a = Math.min(1, (t % 2.4) / 1.2) * Math.PI / 2;
  g.save(); g.translate(W / 2, H / 2 - 60); g.rotate(-a);
  rrect(g, -55, -95, 110, 190, 18, "#3c4670", WHITE, 5); circ(g, 0, 78, 7, WHITE); g.restore();
  txt(g, "Telefonu yan çevir", W / 2, H / 2 + 110, 64, "#ffe65a", { ol: 5 });
  txt(g, "Kuşların İntikamı yatay ekranda oynanır", W / 2, H / 2 + 180, 36, WHITE, { ol: 3 });
}

let lastT = performance.now(), acc = 0;
function frame(now) {
  let dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const g = ctx, port = portrait();
  if (port) autoPause();
  else {
    // Sabit adımlı güncelleme: her cihazda aynı fizik
    acc += dt; let n = 0;
    while (acc >= FPS_DT && n < 4) { G.scene.update(FPS_DT); acc -= FPS_DT; n++; }
    if (n === 4) acc = 0;
  }
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = "#1b2440"; g.fillRect(0, 0, cv.width, cv.height);
  if (port) {   // Dikey ekranda dönme ipucu, ekranın tamamına sığacak şekilde
    const s2 = Math.min(cv.width / DPR / W, cv.height / DPR / H) * 1.6;
    g.setTransform(s2 * DPR, 0, 0, s2 * DPR, (cv.width / DPR - W * s2) / 2 * DPR, (cv.height / DPR - H * s2) / 2 * DPR);
    drawRotateHint(g);
  } else {
    const sh = G.scene.shake || 0, sx = sh > 0.5 ? rand(-sh, sh) : 0, sy = sh > 0.5 ? rand(-sh, sh) : 0;
    g.setTransform(S * DPR, 0, 0, S * DPR, (OX + sx * S) * DPR, (OY + sy * S) * DPR);
    g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
    G.scene.draw(g);
    g.restore();
  }
  requestAnimationFrame(frame);
}

function start() {
  resize();
  LAYER_K = clamp(Math.max(screen.width, screen.height) / W * (window.devicePixelRatio || 1), 1, 2);
  G.resetStats();
  G.scene = new MenuScene();
  requestAnimationFrame(frame);
  window.__KI = { G, Snd, Input };   // Otomatik testler için
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
</script>
