<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randevu Takip</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e7e9ee; --muted: #9aa3b2;
      --border: #2c323d; --accent: #3b82f6; --accent-text: #ffffff;
      --ok: #4ade80; --ok-bg: #12301f; --warn: #fbbf24; --warn-bg: #3a2c0c;
      --bad: #f87171; --bad-bg: #3b1515;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; }
  textarea { resize: vertical; min-height: 60px; }
  button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.small { padding: 5px 9px; font-size: 13px; }
  button:hover { filter: brightness(0.96); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tabs button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .day { font-weight: 600; margin: 18px 0 8px; color: var(--muted); }
  .appt { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: start;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .time { font-weight: 700; font-size: 17px; }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .note { font-size: 14px; margin-top: 4px; white-space: pre-wrap; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .b-bekliyor { background: var(--warn-bg); color: var(--warn); }
  .b-geldi { background: var(--ok-bg); color: var(--ok); }
  .b-gelmedi, .b-iptal { background: var(--bad-bg); color: var(--bad); }
  .actions { display: flex; flex-direction: column; gap: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .hidden { display: none; }
  @media (max-width: 560px) {
    .appt { grid-template-columns: 1fr; }
    .actions { flex-direction: row; flex-wrap: wrap; }
  }
  @media print {
    header .row, .card.form, .tabs, .toolbar, .actions { display: none !important; }
    body { background: #fff; color: #000; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Randevu Takip</h1>
    <div class="row">
      <button id="btnExport" title="Tüm randevuları dosyaya kaydet">Yedek al</button>
      <button id="btnImport" title="Yedek dosyasından geri yükle">Yedekten yükle</button>
      <button onclick="window.print()">Yazdır</button>
      <input type="file" id="fileImport" accept=".json,application/json" class="hidden">
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="sToday">0</b><span>Bugünkü randevu</span></div>
    <div class="stat"><b id="sUpcoming">0</b><span>Yaklaşan (bekleyen)</span></div>
    <div class="stat"><b id="sDone">0</b><span>Bu ay gelen hasta</span></div>
    <div class="stat"><b id="sMissed">0</b><span>Bu ay gelmeyen</span></div>
  </div>

  <div class="card form">
    <h2 id="formTitle">Yeni randevu</h2>
    <form id="form">
      <div class="grid">
        <div><label for="fName">Hasta adı soyadı *</label><input id="fName" required></div>
        <div><label for="fPhone">Telefon</label><input id="fPhone" type="tel" placeholder="05xx xxx xx xx"></div>
        <div><label for="fDate">Tarih *</label><input id="fDate" type="date" required></div>
        <div><label for="fTime">Saat *</label><input id="fTime" type="time" required></div>
        <div><label for="fType">Randevu türü</label>
          <select id="fType">
            <option>Muayene</option><option>Kontrol</option><option>Tahlil sonucu</option>
            <option>İşlem</option><option>Diğer</option>
          </select>
        </div>
        <div><label for="fStatus">Durum</label>
          <select id="fStatus">
            <option value="bekliyor">Bekliyor</option><option value="geldi">Geldi</option>
            <option value="gelmedi">Gelmedi</option><option value="iptal">İptal</option>
          </select>
        </div>
      </div>
      <div style="margin-top:10px"><label for="fNote">Not</label><textarea id="fNote" placeholder="Şikayet, hatırlatma vb."></textarea></div>
      <div class="row" style="margin-top:12px">
        <button class="primary" type="submit" id="btnSave">Kaydet</button>
        <button type="button" id="btnCancel" class="hidden">Vazgeç</button>
        <span id="clash" class="meta"></span>
      </div>
    </form>
  </div>

  <div class="row toolbar" style="justify-content:space-between; margin-bottom:8px">
    <div class="row tabs" id="tabs">
      <button data-f="today" class="active">Bugün</button>
      <button data-f="upcoming">Yaklaşan</button>
      <button data-f="past">Geçmiş</button>
      <button data-f="all">Tümü</button>
    </div>
    <input id="search" placeholder="Hasta adı veya telefon ara…" style="max-width:260px">
  </div>

  <div id="list"></div>
</div>

<script>
const KEY = 'randevular_v1';
const STATUS = { bekliyor: 'Bekliyor', geldi: 'Geldi', gelmedi: 'Gelmedi', iptal: 'İptal' };
let items = load();
let filter = 'today';
let editingId = null;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch { alert('Kayıt yapılamadı. Tarayıcınız veri saklamaya izin vermiyor olabilir.'); }
}
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowTime() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDay(ds) {
  const d = new Date(ds + 'T00:00');
  const label = d.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const t = todayStr();
  if (ds === t) return 'Bugün — ' + label;
  const tm = new Date(); tm.setDate(tm.getDate() + 1);
  if (ds === `${tm.getFullYear()}-${pad(tm.getMonth()+1)}-${pad(tm.getDate())}`) return 'Yarın — ' + label;
  return label;
}

function resetForm() {
  editingId = null;
  $('form').reset();
  $('fDate').value = todayStr();
  $('formTitle').textContent = 'Yeni randevu';
  $('btnSave').textContent = 'Kaydet';
  $('btnCancel').classList.add('hidden');
  $('clash').textContent = '';
}

function checkClash() {
  const d = $('fDate').value, t = $('fTime').value;
  const c = items.find(x => x.date === d && x.time === t && x.id !== editingId && x.status !== 'iptal');
  $('clash').textContent = c ? `⚠ Bu saatte ${c.name} adlı hastanın randevusu var.` : '';
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    name: $('fName').value.trim(), phone: $('fPhone').value.trim(),
    date: $('fDate').value, time: $('fTime').value,
    type: $('fType').value, status: $('fStatus').value, note: $('fNote').value.trim()
  };
  if (!data.name) return;
  if (editingId) {
    Object.assign(items.find(x => x.id === editingId), data);
  } else {
    items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...data });
  }
  save(); resetForm(); render();
});
$('btnCancel').onclick = resetForm;
$('fDate').onchange = checkClash;
$('fTime').onchange = checkClash;

function edit(id) {
  const x = items.find(i => i.id === id); if (!x) return;
  editingId = id;
  $('fName').value = x.name; $('fPhone').value = x.phone; $('fDate').value = x.date;
  $('fTime').value = x.time; $('fType').value = x.type; $('fStatus').value = x.status; $('fNote').value = x.note;
  $('formTitle').textContent = 'Randevuyu düzenle';
  $('btnSave').textContent = 'Güncelle';
  $('btnCancel').classList.remove('hidden');
  checkClash();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setStatus(id, s) { const x = items.find(i => i.id === id); if (x) { x.status = s; save(); render(); } }
function del(id) {
  const x = items.find(i => i.id === id);
  if (x && confirm(`${x.name} adlı hastanın randevusu silinsin mi?`)) {
    items = items.filter(i => i.id !== id); save(); render();
  }
}

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...$('tabs').children].forEach(x => x.classList.toggle('active', x === b));
  render();
});
$('search').addEventListener('input', render);

function render() {
  const t = todayStr(), nt = nowTime(), month = t.slice(0, 7);
  $('sToday').textContent = items.filter(x => x.date === t && x.status !== 'iptal').length;
  $('sUpcoming').textContent = items.filter(x => (x.date > t || (x.date === t && x.time >= nt)) && x.status === 'bekliyor').length;
  $('sDone').textContent = items.filter(x => x.date.startsWith(month) && x.status === 'geldi').length;
  $('sMissed').textContent = items.filter(x => x.date.startsWith(month) && x.status === 'gelmedi').length;

  const q = $('search').value.trim().toLocaleLowerCase('tr-TR');
  let list = items.filter(x => {
    if (filter === 'today' && x.date !== t) return false;
    if (filter === 'upcoming' && x.date < t) return false;
    if (filter === 'past' && x.date >= t) return false;
    if (q && !(x.name.toLocaleLowerCase('tr-TR').includes(q) || x.phone.replace(/\s/g, '').includes(q.replace(/\s/g, '')))) return false;
    return true;
  });
  const asc = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
  list.sort(filter === 'past' ? (a, b) => asc(b, a) : asc);

  if (!list.length) {
    $('list').innerHTML = `<div class="empty">${q ? 'Aramaya uygun randevu bulunamadı.' : 'Burada gösterilecek randevu yok.'}</div>`;
    return;
  }
  let html = '', lastDay = null;
  for (const x of list) {
    if (x.date !== lastDay) { html += `<div class="day">${esc(fmtDay(x.date))}</div>`; lastDay = x.date; }
    const tel = x.phone ? ` · <a href="tel:${esc(x.phone.replace(/\s/g, ''))}">${esc(x.phone)}</a>` : '';
    const quick = x.status === 'bekliyor'
      ? `<button class="small" onclick="setStatus('${x.id}','geldi')">Geldi</button>
         <button class="small" onclick="setStatus('${x.id}','gelmedi')">Gelmedi</button>`
      : `<button class="small" onclick="setStatus('${x.id}','bekliyor')">Beklemeye al</button>`;
    html += `<div class="appt">
      <div class="time">${esc(x.time)}</div>
      <div>
        <div><span class="name">${esc(x.name)}</span><span class="badge b-${x.status}">${STATUS[x.status]}</span></div>
        <div class="meta">${esc(x.type)}${tel}</div>
        ${x.note ? `<div class="note">${esc(x.note)}</div>` : ''}
      </div>
      <div class="actions">${quick}
        <button class="small" onclick="edit('${x.id}')">Düzenle</button>
        <button class="small" onclick="del('${x.id}')">Sil</button>
      </div></div>`;
  }
  $('list').innerHTML = html;
}

$('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `randevu-yedek-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$('btnImport').onclick = () => $('fileImport').click();
$('fileImport').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    if (!confirm(`${data.length} randevu yüklenecek. Mevcut randevular bu yedekle değiştirilsin mi?`)) return;
    items = data; save(); render();
  } catch { alert('Dosya okunamadı. Lütfen bu uygulamadan alınmış bir yedek dosyası seçin.'); }
  e.target.value = '';
};

resetForm();
render();
setInterval(render, 60000);
</script>
</body>
</html>
