# Depoyu statik olarak GitHub Pages'te yayınlar; Shadow Warriors (Vite projesi) derlenip
# shadow_warriors/ klasörünün yerine konur.
name: GitHub Pages

on:
  push:
    branches: [claude/usage-guide-5x7jlf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shadow_warriors/package-lock.json
      - name: Build Shadow Warriors
        working-directory: shadow_warriors
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          for f in *; do
            if [ "$f" != "_site" ] && [ "$f" != "shadow_warriors" ]; then cp -r "$f" _site/; fi
          done
          cp -r shadow_warriors/dist _site/shadow_warriors
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
