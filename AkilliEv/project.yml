# Yedek: AkilliEv.xcodeproj açılmazsa `brew install xcodegen && xcodegen` ile yeniden üretilebilir.
name: AkilliEv
options:
  bundleIdPrefix: com.ugurkaya
  deploymentTarget:
    iOS: "17.0"
targets:
  AkilliEv:
    type: application
    platform: iOS
    sources: [AkilliEv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ugurkaya.AkilliEv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Akıllı Ev"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
